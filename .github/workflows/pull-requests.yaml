name: sumobotBlackMagic

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-upload:
    runs-on: [self-hosted, linux, x64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Detect changed files
        id: detect_changes
        run: |
          # Get list of changed files in this PR
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Determine which targets to build
          BUILD_TARGETS=""
          
          if echo "$CHANGED_FILES" | grep -q "machine/evalBoard/tmdscncd28p65x"; then
            BUILD_TARGETS="$BUILD_TARGETS --config=c2000 //machine/evalBoard/tmdscncd28p65x/swe/app"
          fi
          
          if echo "$CHANGED_FILES" | grep -q "machine/sumobotBlackMagic"; then
            BUILD_TARGETS="$BUILD_TARGETS --config=atmega32u4 //machine/sumobotBlackMagic:app"
          fi
          
          echo "targets=$BUILD_TARGETS" >> $GITHUB_OUTPUT
      
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.8.1
        with:
          bazelisk-cache: true
      
      - name: Build with Bazel
        if: steps.detect_changes.outputs.targets != ''
        run: |
          bazel build ${{ steps.detect_changes.outputs.targets }}
      
      - name: Skip build if no changes
        if: steps.detect_changes.outputs.targets == ''
        run: |
          echo "No relevant changes detected. Skipping build."
      
      - name: List build outputs
        if: steps.detect_changes.outputs.targets != ''
        run: |
          echo "Build outputs:"
          find bazel-bin -type f \( -name "*.hex" -o -name "*.elf" -o -name "*.bin" -o -name "app" \)
      
      - name: Copy artifacts to staging directory
        if: steps.detect_changes.outputs.targets != ''
        run: |
          mkdir -p artifacts
          find bazel-bin -type f \( -name "*.hex" -o -name "*.elf" -o -name "*.bin" -o -name "app" \) -exec cp {} artifacts/ \;
          echo "Artifacts to upload:"
          ls -lh artifacts/
      
      - name: Upload to Artifactory with curl
        if: steps.detect_changes.outputs.targets != ''
        env:
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_API_KEY: ${{ secrets.ARTIFACTORY_API_KEY }}
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          PR_NUMBER="${{ github.event.pull_request.number }}"
          UPLOAD_PATH="builds-local/pull/${PR_NUMBER}/${TIMESTAMP}"
          
          for file in artifacts/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Uploading $filename..."
              curl -u $ARTIFACTORY_USER:$ARTIFACTORY_API_KEY \
                -X PUT \
                -T "$file" \
                "$ARTIFACTORY_URL/${UPLOAD_PATH}/$filename"
              
              if [ $? -eq 0 ]; then
                echo "✓ Successfully uploaded $filename"
              else
                echo "✗ Failed to upload $filename"
                exit 1
              fi
            fi
          done
          
          echo "All artifacts uploaded to: $ARTIFACTORY_URL/${UPLOAD_PATH}/"